<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informasi Stok - SITTA UT</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>SITTA UT</h1>
        <nav>
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="stock.html">Informasi Bahan Ajar</a></li>
                <li><a href="tracking.html">Tracking Pengiriman</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h2>Informasi Stok Bahan Ajar</h2>
        <button class="btn" style="width: auto; margin-top: 1rem;" onclick="openModal('modalTambahStok')">+ Tambah Stok Baru</button>

        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Kode Lokasi</th>
                    <th>Kode Barang</th>
                    <th>Nama Barang</th>
                    <th>Jenis</th>
                    <th>Edisi</th>
                    <th>Stok</th>
                </tr>
            </thead>
            <tbody id="tableStokBody"></tbody>
        </table>
    </div>

    <!-- Modal Tambah Stok Baru -->
    <div id="modalTambahStok" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('modalTambahStok')">&times;</span>
            <h3>Tambah Stok Bahan Ajar</h3>
            <form id="formTambahStok" style="margin-top: 1rem;">
                <div class="form-group"><label>Kode Lokasi</label><input type="text" id="kodeLokasi" required></div>
                <div class="form-group"><label>Kode Barang</label><input type="text" id="kodeBarang" required></div>
                <div class="form-group"><label>Nama Barang</label><input type="text" id="namaBarang" required></div>
                <div class="form-group"><label>Jenis Barang</label><input type="text" id="jenisBarang" value="BMP" required></div>
                <div class="form-group"><label>Edisi</label><input type="text" id="edisi" required></div>
                <div class="form-group"><label>Jumlah Stok</label><input type="number" id="stok" required></div>
                <button type="submit" class="btn">Simpan Data</button>
            </form>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
